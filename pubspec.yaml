name: taleemmate
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: 3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # firebase
  firebase_auth: 6.1.2
  firebase_core: 4.2.1
  firebase_performance: 0.11.1+2
  firebase_crashlytics: 5.0.5
  firebase_remote_config: 6.1.1
  firebase_ai: 3.6.0
  cloud_firestore: 6.1.0
  firebase_storage: 13.0.4

  # icons
  flutter_lucide: 1.7.0
  cupertino_icons: 1.0.8

  # state mangament
  provider: 6.1.5+1
  equatable: 2.0.7
  flutter_bloc: 9.1.1

  # forms
  flutter_form_builder: 10.3.0+2
  form_builder_validators: 11.3.0

  # code gen
  json_annotation: 4.9.0
  freezed_annotation: 3.1.0

  # network
  dio: 5.9.0
  firebase_performance_dio: 0.7.1
  # alice:
  #   path: packages/alice

  # cache
  path: 1.9.1
  path_provider: 2.1.5
  shared_preferences: 2.5.3
  cached_network_image: 3.4.1

  # db + orm
  drift: 2.33.0
  drift_flutter: ^0.3.0

  # configs
  intl: 0.20.2
  color: 3.0.0
  recase: 4.1.0
  themed: 8.1.0
  supercharged: 2.1.1
  navigation_history_observer: 1.1.1 # routing

  # ui related
  flash: 3.1.1
  shimmer: 3.0.0
  flutter_svg: 2.2.3
  top_snackbar_flutter: 3.3.0

  # file handling
  file_picker: 10.3.10
  share_plus: 12.0.1
  image_picker: 1.2.1

  # miscs
  uuid: 4.5.2
  package_info_plus: 8.3.1
  device_info_plus: 12.3.0
  url_launcher: 6.3.2
  flutter_keyboard_visibility: 6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: 6.0.0

  # code gen
  freezed: ^3.2.5
  build_runner: ^2.4.0
  json_serializable: ^6.11.3
  flutter_gen_runner: 5.12.0
  drift_dev: ^2.33.0

  # misc
  # flutter_flavorizr: 2.4.2
  # flutter_launcher_icons: 0.14.4

  # testing
  mockito: 5.6.3

  # Enables the Flutter Driver extension for agent-driven debugging via the
  # Dart MCP server (see test_driver/app.dart). Dev-only — never in release.
  flutter_driver:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_gen:
  output: lib/gen/assets/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  integrations:
    flutter_svg: true

# flutter_launcher_icons:
#   android: "ic_launcher"
#   adaptive_icon_background: "assets/app/app_icon.png"
#   adaptive_icon_foreground: "assets/app/app_icon.png"
#   ios: true
#   remove_alpha_ios: true
#   image_path: "assets/app/app_icon.png"
#   min_sdk_android: 21

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/app/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces/Fraunces_72pt-Regular.ttf
        - asset: fonts/Fraunces/Fraunces_72pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Fraunces/Fraunces_72pt-Bold.ttf
          weight: 700

    - family: Geist
      fonts:
        - asset: fonts/Geist/Geist-Thin.ttf
          weight: 100
        - asset: fonts/Geist/Geist-Light.ttf
          weight: 300
        - asset: fonts/Geist/Geist-Regular.ttf
        - asset: fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist/Geist-Bold.ttf
          weight: 700
        - asset: fonts/Geist/Geist-Italic.ttf
          style: italic
        - asset: fonts/Geist/Geist-BoldItalic.ttf
          weight: 700
          style: italic

    - family: GeistMono
      fonts:
        - asset: fonts/Geist_Mono/GeistMono-Thin.ttf
          weight: 100
        - asset: fonts/Geist_Mono/GeistMono-Light.ttf
          weight: 300
        - asset: fonts/Geist_Mono/GeistMono-Regular.ttf
        - asset: fonts/Geist_Mono/GeistMono-Medium.ttf
          weight: 500
        - asset: fonts/Geist_Mono/GeistMono-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist_Mono/GeistMono-Bold.ttf
          weight: 700
        - asset: fonts/Geist_Mono/GeistMono-Italic.ttf
          style: italic
        - asset: fonts/Geist_Mono/GeistMono-BoldItalic.ttf
          weight: 700
          style: italic

    - family: NotoNastaliqUrdu
      fonts:
        - asset: fonts/Noto_Nastaliq_Urdu/NotoNastaliqUrdu-Regular.ttf
        - asset: fonts/Noto_Nastaliq_Urdu/NotoNastaliqUrdu-Medium.ttf
          weight: 500
        - asset: fonts/Noto_Nastaliq_Urdu/NotoNastaliqUrdu-SemiBold.ttf
          weight: 600
        - asset: fonts/Noto_Nastaliq_Urdu/NotoNastaliqUrdu-Bold.ttf
          weight: 700

flavorizr:
  app:
    android:
      flavorDimensions: 'flavor'
    ios: {}

  flavors:
    stage:
      app:
        name: 'TL-Stage'
      android:
        applicationId: 'dev.mhmz.taleemmate.stage'
        firebase:
          config: '.firebase/stage/google-services.json'
      ios:
        bundleId: 'dev.mhmz.taleemmate.stage'
        firebase:
          config: '.firebase/stage/GoogleService-Info.plist'

    qa:
      app:
        name: 'TL-QA'
      android:
        applicationId: 'dev.mhmz.taleemmate.qa'
        firebase:
          config: '.firebase/qa/google-services.json'
      ios:
        bundleId: 'dev.mhmz.taleemmate.qa'
        firebase:
          config: '.firebase/qa/GoogleService-Info.plist'

    prod:
      app:
        name: 'TaleemMate'
      android:
        applicationId: 'dev.mhmz.taleemmate'
        firebase:
          config: '.firebase/prod/google-services.json'
      ios:
        bundleId: 'dev.mhmz.taleemmate'
        firebase:
          config: '.firebase/prod/GoogleService-Info.plist'