targets:
  $default:
    builders:
      json_serializable:
        options:
          # The default value for each is listed.
          any_map: false
          checked: false
          constructor: ""
          create_factory: true
          create_field_map: false
          create_per_field_to_json: false
          create_to_json: true
          disallow_unrecognized_keys: false
          
          # Nested model objects must serialize via their own toJson() so that
          # toJson()/fromJson() round-trips (e.g. OnboardingData → mock repo →
          # OnboardingData) produce Maps, not raw model instances.
          explicit_to_json: true
          field_rename: none
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: true