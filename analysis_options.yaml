# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

formatter:
  trailing_commas: preserve

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - require_trailing_commas
    - prefer_single_quotes
    - prefer_const_declarations
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - unnecessary_this
    - prefer_final_locals
    - omit_local_variable_types

# ── DCM (dcm.dev) ────────────────────────────────────────────────────────────
# NOT part of `flutter analyze`. Standalone CLI — run `dcm analyze lib`.
# One-time setup (per machine):
#   brew tap CQLabs/dcm && brew install dcm
#   dcm activate --license-key=<your-free-key>   # free key from https://dcm.dev
# IDE squiggles: install the "DCM" VS Code / JetBrains extension.
#
# Function-length budget lives here (file-length is handled separately — DCM has
# no per-file line metric). `source-lines-of-code` counts body lines, excluding
# blanks/comments — break a function up once it exceeds 30.
dart_code_metrics:
  metrics:
    source-lines-of-code: 30
    cyclomatic-complexity: 20
    maximum-nesting-level: 5
    number-of-parameters: 5
  metrics-exclude:
    - test/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  # Browse the free 100-rule set at https://dcm.dev/docs/rules/ and add ids here.
  # rules:
  #   - avoid-unused-parameters
